<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Election Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-900 pb-12">
    <header class="bg-blue-950 text-white py-8 shadow-lg border-b-8 border-red-700">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <div class="text-yellow-400 text-3xl tracking-widest mb-3">★ ★ ★</div>
            <h1 class="text-5xl md:text-7xl font-serif font-black uppercase tracking-wider mb-3">Final Election Returns</h1>
            <p class="text-blue-200 text-xl tracking-[0.3em] font-bold uppercase">Official Results Dashboard</p>
        </div>
    </header>
    
    <div class="max-w-5xl mx-auto mt-12 px-4">
        <div class="bg-white border-4 border-slate-300 shadow-2xl p-8 md:p-14 relative">
            <div class="flex flex-col md:flex-row md:justify-between md:items-end mb-12 border-b-4 border-slate-200 pb-8">
                <h2 class="text-4xl md:text-5xl font-serif font-black text-blue-950">Final Standings</h2>
                <div class="mt-6 md:mt-0 text-right">
                    <p class="text-lg font-extrabold text-slate-500 uppercase tracking-widest mb-2">Total Ballots Cast</p>
                    <p class="text-5xl md:text-6xl font-mono font-black text-slate-800">15</p>
                </div>
            </div>

            <div id="candidates-container">
                <!-- Presidential Race -->
                <h3 class="text-3xl md:text-4xl font-serif font-black text-slate-800 mb-8 uppercase tracking-wider">Presidential</h3>
                
                <div class="mb-14 pl-6 border-l-8 border-blue-900">
                    <div class="flex justify-between items-baseline mb-4">
                        <div class="flex flex-col md:flex-row md:items-center">
                            <span class="font-serif font-black text-3xl md:text-4xl text-slate-900">Cole Fennes</span>
                            <span class="mt-2 md:mt-0 md:ml-4 bg-yellow-400 text-yellow-900 text-sm md:text-base font-black px-3 py-1.5 rounded-md shadow uppercase tracking-widest border-2 border-yellow-500">★ Winner</span>
                        </div>
                        <span class="text-2xl md:text-3xl font-black text-slate-700 font-mono">10 votes (66.7%)</span>
                    </div>
                    <div class="w-full bg-slate-200 h-12 md:h-16 border-4 border-slate-300">
                        <div class="bg-blue-700 h-full" style="width: 66.7%"></div>
                    </div>
                </div>
                
                <div class="mb-16 pl-6 border-l-8 border-amber-500">
                    <div class="flex justify-between items-baseline mb-4">
                        <div class="flex flex-col md:flex-row md:items-center">
                            <span class="font-serif font-black text-3xl md:text-4xl text-slate-900">Konnor Fultz</span>
                        </div>
                        <span class="text-2xl md:text-3xl font-black text-slate-700 font-mono">5 votes (33.3%)</span>
                    </div>
                    <div class="w-full bg-slate-200 h-12 md:h-16 border-4 border-slate-300">
                        <div class="bg-amber-400 h-full" style="width: 33.3%"></div>
                    </div>
                </div>

                <!-- Secretary of State Race -->
                <div class="mt-16 pt-12 border-t-4 border-slate-200">
                    <div class="flex flex-col md:flex-row justify-between items-end mb-8">
                        <h3 class="text-3xl md:text-4xl font-serif font-black text-slate-800 uppercase tracking-wider">Secretary of State</h3>
                        <p class="text-lg font-extrabold text-slate-500 uppercase tracking-widest mt-4 md:mt-0">Votes: <span class="font-mono text-2xl md:text-3xl text-slate-800">8</span></p>
                    </div>
                    
                    <div class="mb-14 pl-6 border-l-8 border-emerald-600">
                        <div class="flex justify-between items-baseline mb-4">
                            <div class="flex flex-col md:flex-row md:items-center">
                                <span class="font-serif font-black text-3xl md:text-4xl text-slate-900">Walker LeVault</span>
                                <span class="mt-2 md:mt-0 md:ml-4 bg-yellow-400 text-yellow-900 border-yellow-500 text-sm md:text-base font-black px-3 py-1.5 rounded-md shadow uppercase tracking-widest border-2">★ Appointed</span>
                            </div>
                            <span class="text-2xl md:text-3xl font-black text-slate-700 font-mono">4 votes (50.0%)</span>
                        </div>
                        <div class="w-full bg-slate-200 h-12 md:h-16 border-4 border-slate-300">
                            <div class="bg-emerald-600 h-full" style="width: 50.0%"></div>
                        </div>
                    </div>
                    
                    <div class="mb-14 pl-6 border-l-8 border-slate-400">
                        <div class="flex justify-between items-baseline mb-4">
                            <div class="flex flex-col md:flex-row md:items-center">
                                <span class="font-serif font-black text-3xl md:text-4xl text-slate-900">Abstain</span>
                            </div>
                            <span class="text-2xl md:text-3xl font-black text-slate-700 font-mono">4 votes (50.0%)</span>
                        </div>
                        <div class="w-full bg-slate-200 h-12 md:h-16 border-4 border-slate-300">
                            <div class="bg-slate-400 h-full" style="width: 50.0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
