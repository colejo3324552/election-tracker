<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Election Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar and hide arrows on number input for a cleaner look */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen p-4 md:p-8 font-sans text-gray-100 flex items-center justify-center">
    
    <!-- Glassmorphism Container -->
    <div class="w-full max-w-2xl mx-auto bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.5)] p-6 md:p-8">
        
        <h1 class="text-3xl font-extrabold text-center mb-8 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400 tracking-tight">
            Live Election Tracker
        </h1>

        <!-- Vote Input Area -->
        <div class="bg-black/20 p-5 rounded-xl mb-10 border border-white/10 shadow-inner">
            <h2 class="text-lg font-semibold mb-4 text-indigo-200">Record Votes</h2>
            <div class="flex flex-col md:flex-row gap-4 items-end">
                <div class="flex-1 w-full">
                    <label class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Candidate</label>
                    <select id="candidateSelect" class="w-full p-3 bg-white/5 border border-white/10 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all [&>option]:text-black">
                        <option value="cole">Cole Fennes (Blue)</option>
                        <option value="konnor">Konnor Fultz (Yellow)</option>
                        <option value="walker">Walker LeVault (Green)</option>
                    </select>
                </div>
                <div class="flex-1 w-full">
                    <label class="block text-xs font-medium text-gray-400 mb-2 uppercase tracking-wider">Amount</label>
                    <input type="number" id="voteAmount" min="1" value="1" class="w-full p-3 bg-white/5 border border-white/10 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-mono text-lg">
                </div>
                <button onclick="addVotes()" class="w-full md:w-auto bg-gradient-to-r from-indigo-500 to-purple-600 text-white px-8 py-3 rounded-lg hover:from-indigo-400 hover:to-purple-500 hover:shadow-[0_0_20px_rgba(99,102,241,0.4)] transform hover:-translate-y-1 transition-all duration-200 font-bold tracking-wide">
                    Submit
                </button>
            </div>
        </div>

        <!-- Results Area -->
        <div>
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-xl font-bold text-white">Current Standings</h2>
                <div class="bg-black/30 px-4 py-1 rounded-full border border-white/10">
                    <p class="text-sm font-medium text-gray-300">Total Votes: <span id="totalVotes" class="text-white font-bold font-mono">0</span></p>
                </div>
            </div>

            <!-- Cole Fennes -->
            <div class="mb-6 group">
                <div class="flex justify-between mb-2">
                    <span class="font-bold text-gray-200 text-lg tracking-wide">Cole Fennes</span>
                    <span class="text-sm font-medium text-gray-400 font-mono" id="coleText">0 votes (0%)</span>
                </div>
                <div class="w-full bg-black/40 rounded-full h-6 border border-white/5 overflow-hidden p-1 shadow-inner">
                    <div id="coleBar" class="bg-gradient-to-r from-cyan-400 to-blue-600 h-full rounded-full transition-all duration-1000 ease-out shadow-[0_0_15px_rgba(59,130,246,0.5)] relative" style="width: 0%">
                        <div class="absolute inset-0 bg-white/20 rounded-full animate-pulse"></div>
                    </div>
                </div>
            </div>

            <!-- Konnor Fultz -->
            <div class="mb-6 group">
                <div class="flex justify-between mb-2">
                    <span class="font-bold text-gray-200 text-lg tracking-wide">Konnor Fultz</span>
                    <span class="text-sm font-medium text-gray-400 font-mono" id="konnorText">0 votes (0%)</span>
                </div>
                <div class="w-full bg-black/40 rounded-full h-6 border border-white/5 overflow-hidden p-1 shadow-inner">
                    <div id="konnorBar" class="bg-gradient-to-r from-yellow-300 to-orange-500 h-full rounded-full transition-all duration-1000 ease-out shadow-[0_0_15px_rgba(245,158,11,0.5)] relative" style="width: 0%">
                        <div class="absolute inset-0 bg-white/20 rounded-full animate-pulse"></div>
                    </div>
                </div>
            </div>

            <!-- Walker LeVault -->
            <div class="mb-6 group">
                <div class="flex justify-between mb-2">
                    <span class="font-bold text-gray-200 text-lg tracking-wide">Walker LeVault</span>
                    <span class="text-sm font-medium text-gray-400 font-mono" id="walkerText">0 votes (0%)</span>
                </div>
                <div class="w-full bg-black/40 rounded-full h-6 border border-white/5 overflow-hidden p-1 shadow-inner">
                    <div id="walkerBar" class="bg-gradient-to-r from-emerald-400 to-green-500 h-full rounded-full transition-all duration-1000 ease-out shadow-[0_0_15px_rgba(16,185,129,0.5)] relative" style="width: 0%">
                        <div class="absolute inset-0 bg-white/20 rounded-full animate-pulse"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-10 pt-6 border-t border-white/10 text-center">
            <button onclick="resetVotes()" class="text-xs text-red-400 hover:text-red-300 hover:underline tracking-widest uppercase transition-colors">
                Danger: Reset All Votes
            </button>
        </div>
    </div>

    <script>
        // Check if there are saved votes in localStorage, otherwise start at 0
        let savedData = localStorage.getItem('electionVotes');
        let votes = savedData ? JSON.parse(savedData) : {
            cole: 0,
            konnor: 0,
            walker: 0
        };

        // Load the UI immediately when the page opens
        window.onload = function() {
            // Slight delay so the transition animations play on load
            setTimeout(updateUI, 100);
        };

        function addVotes() {
            const candidate = document.getElementById('candidateSelect').value;
            const amountInput = document.getElementById('voteAmount').value;
            const amount = parseInt(amountInput);

            if (isNaN(amount) || amount < 1) {
                alert("Please enter a valid vote amount greater than 0.");
                return;
            }

            votes[candidate] += amount;
            localStorage.setItem('electionVotes', JSON.stringify(votes));
            updateUI();
            
            document.getElementById('voteAmount').value = 1;
        }

        function resetVotes() {
            if (confirm("Are you sure you want to delete all votes and start over?")) {
                votes = { cole: 0, konnor: 0, walker: 0 };
                localStorage.setItem('electionVotes', JSON.stringify(votes));
                updateUI();
            }
        }

        function updateUI() {
            const total = votes.cole + votes.konnor + votes.walker;
            document.getElementById('totalVotes').innerText = total.toLocaleString();

            const candidates = ['cole', 'konnor', 'walker'];
            
            candidates.forEach(cand => {
                const candidateVotes = votes[cand];
                const percentage = total === 0 ? 0 : ((candidateVotes / total) * 100).toFixed(1);
                
                document.getElementById(`${cand}Text`).innerText = `${candidateVotes.toLocaleString()} votes (${percentage}%)`;
                
                // Ensure there is a minimum width so the glowing dots are visible even at 0 or 1 vote
                const barWidth = percentage > 0 ? Math.max(percentage, 2) : 0;
                document.getElementById(`${cand}Bar`).style.width = `${barWidth}%`;
            });
        }
    </script>
</body>
</html>
